# Password in a DB connection string/argument, written in the code. Bearer replaces values it
# can't resolve (os.environ, config, function arguments) with a non-ASCII placeholder, so
# requiring a plain ASCII password character right after "PWD="/"password=" keeps passwords
# read from the environment or a config file out.
patterns:
  - pattern: $<FUNC>($<...>$<CONN>$<...>)
    filters:
      - variable: FUNC
        regex: (?i)(\A|\.)(connect|create_engine|create_async_engine|Connection)\z
      - variable: CONN
        detection: idv_python_db_password_in_code_string
        scope: result
  - pattern: $<FUNC>($<...>$<KEY>=$<VALUE>$<...>)
    filters:
      - variable: FUNC
        regex: (?i)(\A|\.)(connect|Connection)\z
      - variable: KEY
        values: [password, passwd, pwd]
      - variable: VALUE
        string_regex: '\A[A-Za-z0-9!#%&()+,./:<>?@^_|~-]'
auxiliary:
  - id: idv_python_db_password_in_code_string
    patterns:
      - pattern: $<STRING>
        filters:
          - variable: STRING
            string_regex: '(?i)((\bpwd|\bpassword)\s*=\s*[A-Za-z0-9!#%&()+,./:<>?@^_|~-]|://[^/:@\s]+:[A-Za-z0-9!#%&()+,.=?_~-]+@)'
languages:
  - python
severity: high
metadata:
  description: Database password in the code
  remediation_message: |-
    ## Description

    The database connection contains the password in plain text.

    ## Remediations

    - **Do** read the password from an environment variable or a protected configuration file.
  cwe_id:
    - 798
  id: idv_python_db_password_in_code
