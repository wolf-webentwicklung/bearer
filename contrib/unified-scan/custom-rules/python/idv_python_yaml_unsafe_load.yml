imports:
  - python_shared_lang_import1
patterns:
  - pattern: $<FUNC>($<_>$<...>)
    filters:
      - variable: FUNC
        detection: python_shared_lang_import1
        scope: cursor
        filters:
          - variable: MODULE1
            values: [yaml]
          - variable: NAME
            values: [unsafe_load, unsafe_load_all, full_load, full_load_all]
  - pattern: $<FUNC>($<_>)
    filters:
      - variable: FUNC
        detection: python_shared_lang_import1
        scope: cursor
        filters:
          - variable: MODULE1
            values: [yaml]
          - variable: NAME
            values: [load, load_all]
  - pattern: $<FUNC>($<_>, $<LOADER>)
    filters:
      - variable: FUNC
        detection: python_shared_lang_import1
        scope: cursor
        filters:
          - variable: MODULE1
            values: [yaml]
          - variable: NAME
            values: [load, load_all]
      - not:
          variable: LOADER
          regex: SafeLoader\z
  - pattern: $<FUNC>($<_>, Loader=$<LOADER>)
    filters:
      - variable: FUNC
        detection: python_shared_lang_import1
        scope: cursor
        filters:
          - variable: MODULE1
            values: [yaml]
          - variable: NAME
            values: [load, load_all]
      - not:
          variable: LOADER
          regex: SafeLoader\z
languages:
  - python
severity: high
metadata:
  description: Unsafe YAML loading
  remediation_message: |-
    ## Description

    yaml.load without SafeLoader (and yaml.unsafe_load/full_load) can create arbitrary Python objects from the file content.

    ## Remediations

    - **Do** use yaml.safe_load(...) or yaml.load(..., Loader=yaml.SafeLoader).
  cwe_id:
    - 502
  id: idv_python_yaml_unsafe_load
