# Password in a connection string, written in the code (see idv_python_db_password_in_code
# for why an ASCII password character is required).
patterns:
  - pattern: $<STRING>
    filters:
      - variable: STRING
        string_regex: '(?i)((\bpwd|\bpassword)\s*=\s*[A-Za-z0-9!#%&()+,./:<>?@^_|~-]|://[^/:@\s]+:[A-Za-z0-9!#%&()+,.=?_~-]+@)'
languages:
  - javascript
severity: high
metadata:
  description: Database password in the code
  remediation_message: |-
    ## Description

    A connection string contains the password in plain text.

    ## Remediations

    - **Do** read the password from an environment variable (process.env) or a protected configuration file.
  cwe_id:
    - 798
  id: idv_javascript_db_password_in_code
